<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Negine Demo</title>
    <style>
        :root {
            --track: rgba(255, 255, 255, 0.08);
            --bar: #fff;
            --caption: rgba(255, 255, 255, 0.45);
            --error: #ff8a80;
        }

        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }

        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: #000;
            transition: opacity 0.6s ease;
            z-index: 1;
        }
        #loader.done { opacity: 0; pointer-events: none; }

        /* Исходный размер картинки (215×59): при масштабировании видны пиксели */
        #logo {
            max-width: 90vw;
            opacity: 0;
            animation: appear 0.8s ease 0.1s forwards;
            filter: drop-shadow(0 0 24px rgba(110, 168, 255, 0.25));
        }

        #track {
            width: 215px; /* по ширине логотипа */
            max-width: 90vw;
            height: 3px;
            border-radius: 3px;
            background: var(--track);
            overflow: hidden;
            opacity: 0;
            animation: appear 0.8s ease 0.3s forwards;
        }
        #bar {
            width: 0%;
            height: 100%;
            border-radius: 3px;
            background: var(--bar);
            box-shadow: 0 0 10px rgba(110, 168, 255, 0.6);
            transition: width 0.3s ease;
        }

        #caption {
            margin-top: -14px;
            min-height: 1em;
            color: var(--caption);
            font: 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
            letter-spacing: 0.08em;
            text-align: center;
            max-width: 80vw;
        }
        #caption.error { color: var(--error); letter-spacing: normal; line-height: 1.4; white-space: pre-wrap; }

        @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
    <script type="module" src="./main.js"></script>
</head>
<body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="loader">
        <img id="logo" src="logo.png" alt="Negine" />
        <div id="track"><div id="bar"></div></div>
        <div id="caption">ЗАГРУЗКА</div>
    </div>
</body>
</html>
